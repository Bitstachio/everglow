# Deletes every roll on Home whose name starts with "Smoke-", the names the
# roll-upload flow gives its rolls. Not discovered as a standalone test.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "events-profile-button"
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "home-loading"
    timeout: 30000
# A roll that was cut but not deleted sits with the closed rolls further down.
- scrollUntilVisible:
    element:
      id: "roll-card"
      text: "Smoke-.*"
    direction: DOWN
    timeout: 6000
    optional: true
- repeat:
    times: 3
    while:
      visible:
        id: "roll-card"
        text: "Smoke-.*"
    commands:
      - tapOn:
          id: "roll-card"
          text: "Smoke-.*"
      - runFlow: delete-roll.yaml
- assertNotVisible:
    id: "roll-card"
    text: "Smoke-.*"
