appId: ${APP_ID}
---
# From Events home, creates an event titled TITLE (with optional DESCRIPTION) and lands on the confirmation.
- tapOn: "Create Event"
- extendedWaitUntil:
    visible: "Create an Event"
    timeout: 10000
- tapOn: "Enter event name"
- inputText: ${TITLE}
- runFlow:
    when:
      true: ${typeof DESCRIPTION !== 'undefined' && DESCRIPTION.length > 0}
    commands:
      - tapOn: "What's this event about?"
      - inputText: ${DESCRIPTION}
- hideKeyboard
- runFlow: dismiss-dev-banner.yaml
- tapOn:
    text: "Create Event"
    below: "Choose time"
- extendedWaitUntil:
    visible: "Your event is live"
    timeout: 15000
