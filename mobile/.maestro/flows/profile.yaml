appId: ${APP_ID}
name: Events avatar opens Account Settings and Back returns home
tags:
  - smoke
  - profile
---
# Prerequisite: sign in and complete onboarding on this device first.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "events-profile-button"
    timeout: 30000
- assertVisible: "Everglow"
- assertNotVisible: "Gallery"
- tapOn:
    id: "events-profile-button"
- assertVisible: "Account Settings"
- assertNotVisible: "Edit Profile"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ".*Back.*"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: "Everglow"
- assertVisible:
    id: "events-profile-button"
