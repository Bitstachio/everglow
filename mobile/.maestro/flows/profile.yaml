appId: ${APP_ID}
name: Events avatar opens the lab card and Back returns home
tags:
  - smoke
  - profile
---
# Needs a signed-in, onboarded session on this device. In the smoke suite the
# login flow runs first and leaves one; run on its own, sign in by hand first.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "events-profile-button"
    timeout: 60000
- tapOn:
    id: "events-profile-button"
- extendedWaitUntil:
    visible:
      id: "account-settings-back"
    timeout: 30000
- assertVisible:
    id: "account-settings"
- assertVisible:
    text: "(?i).*username.*"
- tapOn:
    id: "account-settings-back"
- extendedWaitUntil:
    visible:
      id: "events-profile-button"
    timeout: 30000
- assertVisible: "Everglow"
