name = "everglow-waitlist"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Secrets (set with `wrangler secret put`):
#   RESEND_API_KEY
# Vars:
#   RESEND_SEGMENT_ID = "<segment id from Resend>"
#   ALLOWED_ORIGINS   = "https://everglow.social,https://www.everglow.social,http://localhost:3000"

[vars]
# Replace after creating the waitlist segment in Resend.
RESEND_SEGMENT_ID = "REPLACE_ME"
ALLOWED_ORIGINS = "https://everglow.social,https://www.everglow.social,http://localhost:3000,http://localhost:3001"
