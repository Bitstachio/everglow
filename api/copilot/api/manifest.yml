# The manifest for the "api" service.
# Read the full specification for the "Load Balanced Web Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: api
type: Load Balanced Web Service

# Distribute traffic to your service.
http:
  path: "/"
  # Nest serves the API under /api/v2 (same as the image HEALTHCHECK).
  healthcheck: "/api/v2"
  # DNS for this name is a Namecheap CNAME to the environment load balancer.
  alias: api-staging.everglow.social

# Configuration for your containers and service.
image:
  build: Dockerfile
  port: 3000

cpu: 256
memory: 512
platform: linux/x86_64
count: 1
exec: true
network:
  connect: true

variables:
  NODE_ENV: production
  PORT: "3000"
  TRUST_PROXY: "1"
  AWS_REGION: us-east-1
  # Replace with real staging values before photo features matter.
  AWS_S3_BUCKET: everglow-staging-placeholder
  AWS_ACCESS_KEY_ID: PLACEHOLDER
  # Replace with your Auth0 tenant (same values as local mobile/API).
  # Staging still shares the development tenant and audience, so a development
  # token is accepted here. Give staging its own API identifier (or tenant)
  # before real users: docs/authentication.md §2.1.
  AUTH0_DOMAIN: dev-hr3web1pe4wofusq.us.auth0.com
  AUTH0_AUDIENCE: https://api.everglow.com
  # Required: the API does not start without it. The client id of the native
  # app the staging build signs in with (its EXPO_PUBLIC_AUTH0_CLIENT_ID); only
  # tokens whose azp is this client are accepted. Not a secret.
  # AUTH0_NATIVE_CLIENT_ID: <native app client id>

secrets:
  AWS_SECRET_ACCESS_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/AWS_SECRET_ACCESS_KEY
  # Hosted Postgres (e.g. Neon) — set via: copilot secret init (name DATABASE_URL)
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL

# You can override any of the values defined above by environment.
#environments:
#  test:
#    count: 2               # Number of tasks to run for the "test" environment.
#    deployment:            # The deployment strategy for the "test" environment.
