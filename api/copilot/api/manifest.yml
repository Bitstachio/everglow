# Copilot Load Balanced Web Service:
# https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/
name: api
type: Load Balanced Web Service

http:
  path: "/"
  # Nest HEALTHCHECK path
  healthcheck: "/api/v2"
  # Namecheap CNAME → environment load balancer
  alias: api-staging.everglow.social

image:
  build: Dockerfile
  port: 3000

cpu: 256
memory: 512
platform: linux/x86_64
count: 1
exec: true
network:
  connect: true

variables:
  NODE_ENV: production
  PORT: "3000"
  TRUST_PROXY: "1"
  AWS_REGION: us-east-1
  # No AWS keys: ECS task role via addons/photos-bucket-access.yml.
  # AWS_S3_BUCKET is set per environment below.

  # Shared with local/dev for now. Separate audience/tenant before real users:
  # docs/authentication.md §2.1.
  AUTH0_DOMAIN: dev-hr3web1pe4wofusq.us.auth0.com
  AUTH0_AUDIENCE: https://api.everglow.com
  # Mobile native app client id (EXPO_PUBLIC_AUTH0_CLIENT_ID). azp must match.
  AUTH0_NATIVE_CLIENT_ID: YlcaGdi1IdSzLAtaO1fzI6cprwS8wixc

# Default Copilot retention is 30; keep longer for moderation/deletion questions.
# Alerts: infra/moderation-alerts.tf
logging:
  retention: 90

secrets:
  # copilot secret init DATABASE_URL
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL

# Jobs that mutate S3/Auth0 stay off until infra watches their heartbeats (EV-232).
# Account deletion reconciler stays off while staging shares the dev Auth0 tenant.
# See docs/photos-architecture.md §11.
environments:
  staging:
    variables:
      AWS_S3_BUCKET: everglow-photos-staging
      ACCOUNT_DELETION_RECONCILER_ENABLED: "false"
      PHOTO_ORPHAN_RECONCILER_ENABLED: "false"
      GALLERY_CLOSE_ENABLED: "false"
      MODERATION_EVIDENCE_JOB_ENABLED: "false"
      PHOTO_HASH_BACKFILL_ENABLED: "false"
