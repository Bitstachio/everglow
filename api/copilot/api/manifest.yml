# The manifest for the "api" service.
# Read the full specification for the "Load Balanced Web Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: api
type: Load Balanced Web Service

# Distribute traffic to your service.
http:
  path: "/"
  # Nest serves the API under /api/v2 (same as the image HEALTHCHECK).
  healthcheck: "/api/v2"
  # DNS for this name is a Namecheap CNAME to the environment load balancer.
  alias: api-staging.everglow.social

# Configuration for your containers and service.
image:
  build: Dockerfile
  port: 3000

cpu: 256
memory: 512
platform: linux/x86_64
count: 1
exec: true
network:
  connect: true

variables:
  NODE_ENV: production
  PORT: "3000"
  TRUST_PROXY: "1"
  AWS_REGION: us-east-1
  # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY: the API then signs as the
  # ECS task role, which addons/photos-bucket-access.yml gives S3 rights on
  # the environment's own bucket. AWS_S3_BUCKET is set per environment below.

  # Replace with your Auth0 tenant (same values as local mobile/API).
  # Staging still shares the development tenant and audience, so a development
  # token is accepted here. Give staging its own API identifier (or tenant)
  # before real users: docs/authentication.md §2.1.
  AUTH0_DOMAIN: dev-hr3web1pe4wofusq.us.auth0.com
  AUTH0_AUDIENCE: https://api.everglow.com
  # Required: the API does not start without it. The client id of the native
  # app the staging build signs in with (its EXPO_PUBLIC_AUTH0_CLIENT_ID); only
  # tokens whose azp is this client are accepted. Not a secret.
  # AUTH0_NATIVE_CLIENT_ID: <native app client id>

# The log group /copilot/everglow-<env>-api. Its lines carry user and report
# ids, so they are kept 90 days (Copilot's default is 30): long enough to
# answer a moderation or deletion question about last quarter, short enough
# not to become an archive. The alerts on it are infra/moderation-alerts.tf.
logging:
  retention: 90

secrets:
  # Hosted Postgres (e.g. Neon) — set via: copilot secret init (name DATABASE_URL)
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL

# Values per environment, overriding the ones above.
#
# The scheduled jobs below act on AWS_S3_BUCKET or the Auth0 tenant for the
# rows in DATABASE_URL, and most delete what those rows do not explain. Switch
# them on only in the one environment whose database owns that bucket and
# tenant (docs/photos-architecture.md §11, api/docs/local-setup.md).
#
# Staging owns its bucket, everglow-photos-staging (infra/photos.tf), but its
# tenant is still the shared dev tenant, whose logins belong to every
# developer's database, so the account deletion reconciler stays off. The
# jobs that act on the bucket (orphan reconciler, gallery close, evidence job,
# hash backfill) may run here, but each one turned on needs the matching
# api_jobs_enabled flag in infra/ so its heartbeat is watched; they stay off
# until that lands together (EV-232). All are stated rather than left to the
# code's defaults.
environments:
  staging:
    variables:
      AWS_S3_BUCKET: everglow-photos-staging
      ACCOUNT_DELETION_RECONCILER_ENABLED: "false"
      PHOTO_ORPHAN_RECONCILER_ENABLED: "false"
      GALLERY_CLOSE_ENABLED: "false"
      MODERATION_EVIDENCE_JOB_ENABLED: "false"
      PHOTO_HASH_BACKFILL_ENABLED: "false"
      # Upload screening sends photos to Rekognition. Off until the steps in
      # infra/README.md ("Before turning on upload screening") are done.
      MODERATION_SCREENING_ENABLED: "false"
