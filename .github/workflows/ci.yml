name: CI

on:
  # Every pull request, whatever its base: stacked PRs whose base is another
  # feature branch need the same checks as PRs into main.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/**'
            mobile:
              - 'mobile/**'
              - 'api/openapi/**'
              - '.github/workflows/**'

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
        background: true
      - name: OpenAPI spec is up to date
        run: pnpm run openapi:check
        background: true
      # Avoid --fix in CI (scripts must not mutate files)
      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
        background: true
      # Full-project type check — specs and scripts are excluded from the
      # build tsconfig and ts-jest transpiles without type checking
      - run: pnpm run typecheck
        background: true
      - run: pnpm run test:cov
        background: true
      - wait-all:

      - run: pnpm run test:integration

      - run: pnpm run build

      - name: Validate docker-compose config
        # compose requires .env to exist (env_file); stub it from the example
        run: cp .env.example .env && docker compose config -q

      - uses: docker/setup-buildx-action@v3

      - name: Docker image builds
        uses: docker/build-push-action@v6
        with:
          context: api
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last step: only reached when the whole job is green.
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          bash ../.github/scripts/post-coverage-comment.sh
          everglow-api-coverage
          "API unit-test coverage"
          "Unit suite only; controllers are exercised by the integration suite."
          "Unit=coverage/coverage-summary.json"

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generated API types are up to date
        run: pnpm run openapi:check
      - run: pnpm run format:check
        background: true
      - run: pnpm run lint
        background: true
      - run: pnpm exec tsc --noEmit
        background: true
      - wait-all:

      # Sequential: RNTL suites starve if they share a 2-core runner with tsc/lint
      # Coverage settings live in jest.coverage.js; collecting them adds no
      # measurable time to either suite.
      - name: Unit tests
        run: pnpm test --maxWorkers=2 --coverage
      - name: Integration tests
        run: pnpm test:integration --coverage

      # Last step: only reached when the whole job is green.
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          bash ../.github/scripts/post-coverage-comment.sh
          everglow-mobile-coverage
          "Mobile test coverage"
          "Same source files measured by each suite; screens are mostly exercised by the integration suite. Excludes the generated API client."
          "Unit=coverage/unit/coverage-summary.json"
          "Integration=coverage/integration/coverage-summary.json"

  ci-success:
    name: CI
    needs: [changes, api, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require passing jobs
        run: |
          FAILED=0
          check_job() {
            name="$1"
            result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$name job: $result (see that job's logs for details)"
              FAILED=1
            fi
          }
          check_job "API" "${{ needs.api.result }}"
          check_job "Mobile" "${{ needs.mobile.result }}"
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "All executed jobs passed (or were skipped)."
