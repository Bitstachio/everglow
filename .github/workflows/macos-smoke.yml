name: Mac smoke

on:
  workflow_dispatch:

concurrency:
  group: macos-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  login-ios:
    name: Maestro login (iOS)
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AUTH0_DOMAIN: ${{ secrets.EXPO_PUBLIC_AUTH0_DOMAIN }}
      EXPO_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AUTH0_CLIENT_ID }}
      EXPO_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.EXPO_PUBLIC_AUTH0_AUDIENCE }}
      EXPO_PUBLIC_AUTH0_PASSWORD_CHANGE_RESULT_URL: everglowmobile://password-change/result
      MAESTRO_VERSION: "2.10.0"
      # Bump to invalidate every Mac smoke cache this workflow keeps.
      CACHE_EPOCH: v1

    steps:
      - uses: actions/checkout@v4

      - name: Require E2E and Expo secrets
        run: |
          missing=0
          for name in E2E_EMAIL E2E_PASSWORD EXPO_PUBLIC_API_URL \
            EXPO_PUBLIC_AUTH0_DOMAIN EXPO_PUBLIC_AUTH0_CLIENT_ID EXPO_PUBLIC_AUTH0_AUDIENCE; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set secrets with: gh secret set <NAME>"
            echo "EXPO_PUBLIC_API_URL must be a public HTTPS API (not localhost)."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            http://localhost*|http://127.0.0.1*)
              echo "EXPO_PUBLIC_API_URL cannot be localhost on a GitHub runner."
              exit 1
              ;;
          esac

      - name: Write mobile/.env for the Release build
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}"
            echo "EXPO_PUBLIC_AUTH0_DOMAIN=${EXPO_PUBLIC_AUTH0_DOMAIN}"
            echo "EXPO_PUBLIC_AUTH0_CLIENT_ID=${EXPO_PUBLIC_AUTH0_CLIENT_ID}"
            echo "EXPO_PUBLIC_AUTH0_AUDIENCE=${EXPO_PUBLIC_AUTH0_AUDIENCE}"
            echo "EXPO_PUBLIC_AUTH0_PASSWORD_CHANGE_RESULT_URL=${EXPO_PUBLIC_AUTH0_PASSWORD_CHANGE_RESULT_URL}"
          } > .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iPhone simulator
        id: sim
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = []
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      devices.append(d["udid"])
          if not devices:
              sys.exit("No available iPhone simulator")
          print(devices[-1])
          ')"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Reduce Auth0 password-field fights with iOS AutoFill.
          xcrun simctl spawn "$DEVICE_ID" defaults write com.apple.Preferences AutoFillPasswords -bool false || true

      # CocoaPods download cache only (not ios/Pods). ios/ is gitignored CNG
      # output, so Podfile.lock does not exist until after prebuild; the key
      # stands in for what decides pod versions (JS lockfile + Expo config).
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ env.CACHE_EPOCH }}-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/package.json', 'mobile/app.config.ts', 'mobile/app.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{ env.CACHE_EPOCH }}-

      - name: Prebuild native iOS project
        run: pnpm exec expo prebuild --platform ios --non-interactive

      # expo run:ios does not pass -derivedDataPath, so a restored default
      # DerivedData tree is easy to poison across Xcode image updates. Drive
      # xcodebuild ourselves into a fixed path we can cache, then simctl install.
      - name: Record Xcode version
        id: xcode
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/everglow-deriveddata
          # Exact key only: a partial DerivedData hit against a different native
          # graph is often slower than a cold compile.
          key: ${{ runner.os }}-deriveddata-${{ env.CACHE_EPOCH }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/package.json', 'mobile/app.config.ts', 'mobile/app.json') }}

      - name: Build and install Release (no Metro)
        working-directory: mobile
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          DERIVED_DATA="${HOME}/everglow-deriveddata"
          ARCH="$(uname -m)"
          mkdir -p "$DERIVED_DATA"
          # Hosted macos runners are Apple Silicon; Release otherwise builds
          # arm64+x86_64 for the simulator and roughly doubles compile work.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app under $DERIVED_DATA/Build/Products/Release-iphonesimulator"
            exit 1
          fi
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Maestro login smoke
        run: pnpm run test:e2e:login:ios:ci

      # Maestro writes every -e value into commands.json, and this repo's
      # artifacts are public. Never upload results that still hold a secret.
      - name: Scrub secrets from Maestro results
        id: scrub
        if: always()
        run: node ./scripts/scrub-maestro-results.js .maestro/results E2E_PASSWORD

      - name: Upload Maestro results
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: maestro-login-ios-${{ github.run_id }}
          path: |
            mobile/.maestro/results/
          if-no-files-found: ignore
          retention-days: 7
